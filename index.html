*{box-sizing:border-box;margin:0;padding:0;font-family:'Patrick Hand',cursive}
body{background:#101010;color:#fff;text-align:center;min-height:100vh}
body.lock{overflow:hidden}
header{padding:28px 16px 12px}h1{font-size:clamp(44px,8vw,64px);margin-bottom:18px}
#search{width:min(92%,580px);padding:14px 16px;border:0;border-radius:10px;font-size:20px;outline:none}
nav{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;padding:10px 14px 20px}
nav button{padding:10px 15px;border:0;border-radius:9px;background:#fff;color:#111;font-size:17px;cursor:pointer}
nav button.active{background:#ff9800;color:#fff}
#count{color:#bbb;font-size:18px;margin-bottom:8px}
#gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px;max-width:1250px;margin:auto;padding:18px}
.card{background:#202020;padding:14px;border-radius:15px;box-shadow:0 0 17px rgba(255,255,255,.07)}
.wrap{position:relative;overflow:hidden;border-radius:11px;background:#171717}
.card img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover;cursor:pointer;background:#171717}
.missing{display:none;position:absolute;left:10px;right:10px;bottom:10px;background:rgba(0,0,0,.75);padding:7px;border-radius:8px;font-size:15px;word-break:break-word}
.card.bad .missing{display:block}
.card h3{font-size:24px;margin:12px 0 3px}.cat{color:#bbb;margin-bottom:10px}
.buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.action{min-height:47px;border:0;border-radius:8px;color:#fff;font-size:18px;cursor:pointer}
.download{grid-column:1/-1;background:#ff9800}.full{background:#159fea}.wa{background:#00d65a}
#none{display:none;padding:55px 20px;font-size:25px}
footer{padding:34px 16px 42px;font-size:22px}footer a{color:#00bfff;text-decoration:none;font-size:24px}
.viewer{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.95);z-index:9999;padding:58px 18px 20px}
.viewer img{max-width:95vw;max-height:87vh;border-radius:10px;object-fit:contain}
.close{position:fixed;top:10px;right:18px;border:0;background:none;color:#fff;font-size:46px;cursor:pointer}
@media(max-width:600px){#gallery{grid-template-columns:1fr;padding:15px}nav button{font-size:16px;padding:9px 13px}}

function placeholder(title,file){
 const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000"><rect width="100%" height="100%" fill="#171717"/><text x="50%" y="46%" fill="white" font-family="Arial" font-size="44" text-anchor="middle">${safe(title)}</text><text x="50%" y="53%" fill="#bbb" font-family="Arial" font-size="24" text-anchor="middle">Add image file:</text><text x="50%" y="58%" fill="#ff9800" font-family="Arial" font-size="24" text-anchor="middle">${safe(file)}</text></svg>`;

}
function imageError(img){

}
function render(){

  const img=card.querySelector("img");

  card.querySelector(".full").onclick=()=>openViewer(img);
  card.querySelector(".wa").onclick=()=>shareWA(w.title,img);
  gallery.appendChild(card)

}
function apply(){

}
